[package]
edition = "2024"
name = "hazard3-ttp223b"
version = "0.3.0"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async no_std TTP223B touch sensor driver for the Hazard3 ecosystem."
documentation = "https://docs.rs/hazard3-ttp223b"
readme = "README.md"
keywords = [
    "hazard3",
    "ttp223",
    "touch",
    "no-std",
    "embedded",
]
categories = [
    "embedded",
    "no-std",
    "hardware-support",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jorgeandrecastro/hazard3-ttp223b"

[lib]
name = "hazard3_ttp223b"
path = "src/lib.rs"

[features]
default = ["time-hazard3"]
time-hazard3 = ["dep:time-hazard3-backend"]
time-upstream = ["dep:embassy-time"]

[dependencies]
embedded-hal = { version = "1.0", default-features = false }
embassy-time = { version = "0.5", optional = true, default-features = false }
time-hazard3-backend = { package = "hazard3-time", version = "0.1.3", optional = true, default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true